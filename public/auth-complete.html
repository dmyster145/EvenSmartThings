<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartThings Connected</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #0f0f0f;
        color: #f0f0f0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 16px;
        padding: 32px 24px;
        max-width: 400px;
        width: 100%;
        text-align: center;
      }
      .icon {
        width: 56px;
        height: 56px;
        background: #1a3a2a;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px;
        font-size: 28px;
      }
      h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.4px; margin-bottom: 10px; }
      p { font-size: 15px; color: #999; line-height: 1.5; margin-bottom: 24px; }
      .badge {
        display: inline-block;
        background: #1a3a2a;
        color: #4ade80;
        font-size: 13px;
        font-weight: 500;
        padding: 4px 12px;
        border-radius: 20px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">✓</div>
      <h1>Authorization Complete</h1>
      <p>SmartThings connected. Returning to the app&hellip;</p>
      <span class="badge" id="status">Redirecting…</span>
    </div>
    <script>
      (function () {
        try {
          var params = new URLSearchParams(window.location.search);
          var st = params.get('_st');
          var appUrl = params.get('app_url');
          // If we have the original ehpk URL, navigate back to it with the session token appended.
          // This keeps the WebView on the ehpk origin (not the Vercel SPA) so the bridge and
          // API calls work correctly.
          if (appUrl) {
            var dest = appUrl + (appUrl.indexOf('?') !== -1 ? '&' : '?') + (st ? '_st=' + encodeURIComponent(st) : '_auth_return=1');
            window.location.replace(dest);
            return;
          }
          // Fallback: store token in localStorage and stay on this page (user sees "Authorization Complete").
          if (st) {
            localStorage.setItem('smartthings_controls_bearer_session', st);
          }
        } catch (e) { /* ignore */ }
      })();
    </script>
  </body>
</html>
