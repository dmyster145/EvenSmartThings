<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartThings Connected</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #0f0f0f;
        color: #f0f0f0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 16px;
        padding: 32px 24px;
        max-width: 400px;
        width: 100%;
        text-align: center;
      }
      .icon {
        width: 56px;
        height: 56px;
        background: #1a3a2a;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px;
        font-size: 28px;
      }
      h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.4px; margin-bottom: 10px; }
      p { font-size: 15px; color: #999; line-height: 1.5; margin-bottom: 24px; }
      .badge {
        display: inline-block;
        background: #1a3a2a;
        color: #4ade80;
        font-size: 13px;
        font-weight: 500;
        padding: 4px 12px;
        border-radius: 20px;
      }
      .btn {
        display: inline-block;
        margin-top: 20px;
        background: #f0f0f0;
        color: #0f0f0f;
        font-size: 15px;
        font-weight: 600;
        padding: 12px 28px;
        border-radius: 10px;
        border: none;
        cursor: pointer;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">✓</div>
      <h1>Authorization Complete</h1>
      <p id="auth-message">SmartThings is connected. Return to the Even app and tap <strong style="color:#f0f0f0;">Refresh</strong> to finish setup.</p>
      <span class="badge" id="auth-badge">Done — return to Even app</span>
      <button class="btn" id="refresh-btn" style="display:none" onclick="window.location.assign('/')">Refresh</button>
    </div>
    <script>
      (function () {
        try {
          var params = new URLSearchParams(window.location.search);
          var st = params.get('_st');
          if (st) {
            localStorage.setItem('smartthings_controls_bearer_session', st);
          }

          // Detect context: the pendingAuthId is written to localStorage only by the
          // Even Hub WebView when the user taps "Connect SmartThings". Safari's
          // localStorage is isolated and will never have this key.
          // - WebView: show Refresh button so the user can navigate back to the SPA
          //   (same origin, same localStorage — token is already stored above).
          // - Safari: show "Return to Even app" only. The Even Hub WebView's own
          //   Refresh button uses checkPendingAuth() via Redis, which keeps the
          //   session in the WebView's localStorage where it belongs.
          var pendingAuthId = localStorage.getItem('smartthings_controls_pending_auth');
          if (pendingAuthId) {
            document.getElementById('refresh-btn').style.display = 'block';
            document.getElementById('auth-message').innerHTML =
              'SmartThings is connected. Tap <strong style="color:#f0f0f0;">Refresh</strong> below to finish setup.';
            document.getElementById('auth-badge').textContent = 'Connected';
          }
        } catch (e) { /* ignore */ }
      })();
    </script>
  </body>
</html>
