<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartThings Connected</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #0f0f0f;
        color: #f0f0f0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 16px;
        padding: 32px 24px;
        max-width: 400px;
        width: 100%;
        text-align: center;
      }
      .icon {
        width: 56px;
        height: 56px;
        background: #1a3a2a;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px;
        font-size: 28px;
      }
      h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.4px; margin-bottom: 10px; }
      p { font-size: 15px; color: #999; line-height: 1.5; margin-bottom: 24px; }
      .badge {
        display: inline-block;
        background: #1a3a2a;
        color: #4ade80;
        font-size: 13px;
        font-weight: 500;
        padding: 4px 12px;
        border-radius: 20px;
      }
      .btn {
        display: inline-block;
        margin-top: 20px;
        background: #f0f0f0;
        color: #0f0f0f;
        font-size: 15px;
        font-weight: 600;
        padding: 12px 28px;
        border-radius: 10px;
        border: none;
        cursor: pointer;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">✓</div>
      <h1>Authorization Complete</h1>
      <p id="auth-message">SmartThings is connected. Return to the Even app and tap <strong style="color:#f0f0f0;">Refresh</strong> to finish setup.</p>
      <span class="badge" id="auth-badge">Done — return to Even app</span>
      <button class="btn" id="refresh-btn" style="display:none" onclick="window.location.assign('/')">Refresh</button>
    </div>
    <script>
      (function () {
        try {
          var params = new URLSearchParams(window.location.search);
          var st = params.get('_st');
          var appUrl = params.get('app_url');

          if (st) {
            localStorage.setItem('smartthings_controls_bearer_session', st);
          }

          // Detect context using pendingAuthId in localStorage.
          // The Even Hub WebView writes this key when the user taps "Connect SmartThings".
          // Safari's localStorage is completely isolated from the WebView — it will never
          // have this key. This is the only reliable way to tell the two contexts apart.
          var pendingAuthId = null;
          try { pendingAuthId = localStorage.getItem('smartthings_controls_pending_auth'); } catch (e) { /* ignore */ }

          if (pendingAuthId) {
            if (st && appUrl) {
              // Running inside the Even Hub WebView with a session token and a return URL.
              // Redirect back to the SPA so authentication completes without user interaction.
              // app_url is validated server-side to be a localhost address only.
              var sep = appUrl.indexOf('?') >= 0 ? '&' : '?';
              window.location.replace(appUrl + sep + '_st=' + encodeURIComponent(st));
              return;
            }
            // WebView context but missing _st or app_url (e.g. user cancelled OAuth, or a
            // speculative prefetch consumed the state before the real request). Show the
            // Refresh button so the user can manually trigger checkPendingAuth().
            document.getElementById('refresh-btn').style.display = 'block';
            document.getElementById('auth-message').innerHTML =
              'SmartThings authorization is in progress. Tap <strong style="color:#f0f0f0;">Refresh</strong> below to complete setup.';
            document.getElementById('auth-badge').textContent = 'Tap Refresh below';
          }

          // Safari (no pendingAuthId): show the default "Return to Even app" message only.
        } catch (e) { /* ignore */ }
      })();
    </script>
  </body>
</html>
