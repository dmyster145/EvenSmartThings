<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartThings Connected</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #0f0f0f;
        color: #f0f0f0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 16px;
        padding: 32px 24px;
        max-width: 400px;
        width: 100%;
        text-align: center;
      }
      .icon {
        width: 56px;
        height: 56px;
        background: #1a3a2a;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px;
        font-size: 28px;
      }
      h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.4px; margin-bottom: 10px; }
      p { font-size: 15px; color: #999; line-height: 1.5; margin-bottom: 24px; }
      .badge {
        display: inline-block;
        background: #1a3a2a;
        color: #4ade80;
        font-size: 13px;
        font-weight: 500;
        padding: 4px 12px;
        border-radius: 20px;
      }
      .btn {
        display: inline-block;
        margin-top: 20px;
        background: #f0f0f0;
        color: #0f0f0f;
        font-size: 15px;
        font-weight: 600;
        padding: 12px 28px;
        border-radius: 10px;
        border: none;
        cursor: pointer;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">✓</div>
      <h1>Authorization Complete</h1>
      <p id="auth-message">SmartThings is connected. Return to the Even app and tap <strong style="color:#f0f0f0;">Refresh</strong> to finish setup.</p>
      <span class="badge" id="auth-badge">Done — return to Even app</span>
      <button class="btn" id="refresh-btn" style="display:none" onclick="window.location.assign('/')">Refresh</button>
    </div>
    <script>
      (function () {
        try {
          var params = new URLSearchParams(window.location.search);
          var st = params.get('_st');
          var appUrl = params.get('app_url');

          if (st) {
            localStorage.setItem('smartthings_controls_bearer_session', st);
          }

          // If app_url is a localhost/127.0.0.1 address, this page loaded inside the
          // Even Hub WebView (the ehpk is served from a local port). Redirect back to
          // the SPA with the _st token so it can authenticate without the user needing
          // to do anything. The SPA's consumeSessionTokenFromUrl() handles the rest.
          if (st && appUrl && /^https?:\/\/(localhost|127\.0\.0\.1)(:\d+)?/.test(appUrl)) {
            var sep = appUrl.indexOf('?') >= 0 ? '&' : '?';
            window.location.replace(appUrl + sep + '_st=' + encodeURIComponent(st));
            return;
          }

          // Not in WebView (e.g. Safari after iOS Universal Link redirect) —
          // show the "Return to Even app" message. The WebView will recover the
          // session via checkPendingAuth() when the user reopens the app.
        } catch (e) { /* ignore */ }
      })();
    </script>
  </body>
</html>
